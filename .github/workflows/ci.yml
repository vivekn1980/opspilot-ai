name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Never actually connected to — prisma generate/typecheck/build/test
      # (all mocked) don't touch a real database, this just needs to parse
      # as a valid postgresql:// URL for the datasource provider.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Test API
        run: npm run test:api

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web
