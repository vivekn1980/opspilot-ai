name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Local dev only — the DB is never actually connected to during
      # `prisma generate` / typecheck / build, just needs to resolve.
      DATABASE_URL: "file:./ci.db"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Test API
        run: npm run test:api

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web
